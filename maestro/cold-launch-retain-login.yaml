appId: com.cozyla.choresreward
name: Kill and reopen retains signed-in state
---
# 0.2 杀进程再进仍是登录态

- killApp

- launchApp:
    clearState: false
    stopApp: true

- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/czl_nav_bar"
    timeout: 8000

- assertNotVisible:
    id: "com.cozyla.choresreward:id/txtGetStarted"
