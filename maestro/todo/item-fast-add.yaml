appId: com.cozyla.choresreward
name: Todo fast add in fixture list
---
# 只验证一件事：夹具 List 卡片内的快速添加能落到这张卡片上。
- runFlow: subflows/cleanup-fixture.yaml
- runFlow: subflows/create-fixture-list.yaml

# 快速添加入口必须绑定到夹具卡片本身。
# 不能用 below —— 坐标关系会命中相邻卡片的快速添加，把数据写进用户的 List。
- tapOn:
    id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
    childOf:
      # 卡片根下有多个直接子节点，限定到「承载快速添加的那层」，否则会取树序第一个。
      containsChild:
        id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
      childOf:
        containsDescendants:
          - id: "com.cozyla.choresreward:id/tv_todolist_title"
            text: "E2E Todo"
- tapOn:
    id: "com.cozyla.choresreward:id/et_content"
- inputText: "E2EFast"
- tapOn:
    id: "com.cozyla.choresreward:id/iv_confirm"
# 结果必须落在夹具那张卡里；全屏出现 "E2EFast" 不算通过。
# 改用 E2EFast（无下划线）避免中文输入法将半角 _ 自动转为全角 ＿ 导致断言失败。
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/tv_todo_info_title"
      text: "E2EFast"
      childOf:
        containsDescendants:
          - id: "com.cozyla.choresreward:id/tv_todolist_title"
            text: "E2E Todo"
    timeout: 5000

# 夹具留给下一条脚本开头的 cleanup-fixture，结尾再清会多一次杀进程级等待。
