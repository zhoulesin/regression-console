appId: com.cozyla.choresreward
name: Todo item fast and full CRUD
---
- runFlow: subflows/cleanup-fixture.yaml
- runFlow: subflows/create-fixture-list.yaml

# List 卡片快速添加。
# 快速添加入口必须绑定到夹具卡片本身（卡片根 ll_todo_root_view 含标题），
# 不能用 below —— 坐标关系会命中相邻卡片的快速添加，把数据写进用户的 List。
- tapOn:
    id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
    childOf:
      # 卡片根下有多个直接子节点，必须限定到「承载快速添加的那层」，否则会取树序第一个。
      containsChild:
        id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
      childOf:
        containsDescendants:
          - id: "com.cozyla.choresreward:id/tv_todolist_title"
            text: "E2E Todo"
- tapOn:
    id: "com.cozyla.choresreward:id/et_content"
- inputText: "E2E_Fast"
- tapOn:
    id: "com.cozyla.choresreward:id/iv_confirm"
- extendedWaitUntil:
    visible: "E2E_Fast"
    timeout: 5000

# 根页 Add 打开完整创建，指定夹具 List，并设置 Flag。
- tapOn:
    id: "com.cozyla.choresreward:id/iv_todo_root_add"
- tapOn:
    id: "com.cozyla.choresreward:id/editName"
- inputText: "E2E_Full"
- tapOn:
    id: "com.cozyla.choresreward:id/todoListLayout"
# 弹窗里的行标题与弹窗外「List」行共用 txtTodoListName，必须用 text 区分。
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/txtTodoListName"
      text: "E2E Todo"
    timeout: 10000
# 选中夹具 List。应用 item 点击带 1s 级防抖，Maestro 的连续点击可能被吞，
# 因此只要弹窗还在就重试；弹窗一旦关闭，条件不满足即跳过。
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              id: "com.cozyla.choresreward:id/txtTodoListName"
              text: "E2E Todo"
          commands:
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                id: "com.cozyla.choresreward:id/txtTodoListName"
                text: "E2E Todo"
# 写入前确认这条 Todo 会落到夹具 List，而不是别人的 List。
- assertVisible:
    id: "com.cozyla.choresreward:id/txtTodoListDesc"
    text: "E2E Todo"
- tapOn:
    id: "com.cozyla.choresreward:id/imgFlag"
- tapOn:
    id: "com.cozyla.choresreward:id/txtSave"
- extendedWaitUntil:
    visible: "E2E_Full"
    timeout: 5000

# 编辑并验证杀进程后的持久化。
- tapOn: "E2E_Full"
- tapOn:
    id: "com.cozyla.choresreward:id/editName"
- eraseText
- inputText: "E2E_Edited"
- tapOn:
    id: "com.cozyla.choresreward:id/txtSave"
- extendedWaitUntil:
    visible: "E2E_Edited"
    timeout: 5000

- stopApp
- runFlow: subflows/open-todo.yaml
- runFlow: subflows/set-list-manual.yaml
- scrollUntilVisible:
    element: "E2E Todo"
    direction: RIGHT
    timeout: 5000
- assertVisible: "E2E_Fast"
- assertVisible: "E2E_Edited"
- assertNotVisible: "E2E_Full"

# 从编辑弹窗删除快速添加的 Todo。
- tapOn: "E2E_Fast"
- tapOn:
    id: "com.cozyla.choresreward:id/imgDeleteTodo"
- runFlow:
    when:
      visible:
        id: "com.cozyla.choresreward:id/txtDelete"
    commands:
      - tapOn:
          id: "com.cozyla.choresreward:id/txtDelete"
- extendedWaitUntil:
    notVisible: "E2E_Fast"
    timeout: 5000
