appId: com.cozyla.choresreward
name: Todo show completed toggle hides and shows completed items
---
# 功能点 4.2：Show completed 开关。
# 验证：关闭开关 → 已完成 Todo 不可见；开启 → 重新可见。

- runFlow: subflows/cleanup-fixture.yaml
- runFlow: subflows/create-fixture-list.yaml

# ── 创建一条 Todo 并勾选完成 ──
- tapOn:
    id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
    childOf:
      containsChild:
        id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
      childOf:
        containsDescendants:
          - id: "com.cozyla.choresreward:id/tv_todolist_title"
            text: "E2E Todo"
- tapOn:
    id: "com.cozyla.choresreward:id/et_content"
- inputText: "E2EComp"
- tapOn:
    id: "com.cozyla.choresreward:id/iv_confirm"

- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/tv_todo_info_title"
      text: "E2EComp"
    timeout: 5000

# 勾选完成
- tapOn:
    id: "com.cozyla.choresreward:id/fl_todoitem_check"
    childOf:
      containsDescendants:
        - id: "com.cozyla.choresreward:id/tv_todo_info_title"
          text: "E2EComp"

- waitForAnimationToEnd:
    timeout: 2000

# ── 打开 Display 弹窗 ──
- tapOn:
    id: "com.cozyla.choresreward:id/llDisplay"

- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/sb_show_completed"
    timeout: 3000

# ── 关闭 Show completed ──
# sb_show_completed 默认 checked=true，点击关闭
- tapOn:
    id: "com.cozyla.choresreward:id/sb_show_completed"

- back

# ── 判定：已完成 Todo 不可见 ──
# 关闭 show completed 后，已完成条目（cons_todo_comp_item_root）应全部隐藏
- extendedWaitUntil:
    notVisible:
      id: "com.cozyla.choresreward:id/cons_todo_comp_item_root"
    timeout: 3000

# ── 重新打开 Show completed ──
- tapOn:
    id: "com.cozyla.choresreward:id/llDisplay"

- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/sb_show_completed"
    timeout: 3000

- tapOn:
    id: "com.cozyla.choresreward:id/sb_show_completed"

- back

# ── 判定：已完成 Todo 重新可见 ──
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/cons_todo_comp_item_root"
    timeout: 5000

# ── 恢复默认配置 ──
- tapOn:
    id: "com.cozyla.choresreward:id/llDisplay"
- tapOn:
    id: "com.cozyla.choresreward:id/rl_group_list_container"
- tapOn:
    id: "com.cozyla.choresreward:id/ll_sort_manual_container"
- back
