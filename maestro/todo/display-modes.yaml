appId: com.cozyla.choresreward
name: Todo portrait display modes persist and restore
---
- runFlow: subflows/open-todo.yaml

- tapOn:
    id: "com.cozyla.choresreward:id/llDisplay"

- tapOn:
    id: "com.cozyla.choresreward:id/rl_group_profile_container"
- assertVisible:
    id: "com.cozyla.choresreward:id/rl_group_profile_container"
    selected: true

- tapOn:
    id: "com.cozyla.choresreward:id/ll_sort_duedate_container"
- assertVisible:
    id: "com.cozyla.choresreward:id/ll_sort_duedate_container"
    selected: true

- tapOn:
    id: "com.cozyla.choresreward:id/ll_sort_title_container"
- assertVisible:
    id: "com.cozyla.choresreward:id/ll_sort_title_container"
    selected: true

# 自定义 SwitchButton 不向无障碍层暴露真实 checked 状态。
# 此处切换两次验证控件可交互且恢复原值；可见性行为在 completion.yaml 验证。
- tapOn:
    id: "com.cozyla.choresreward:id/sb_show_completed"
- tapOn:
    id: "com.cozyla.choresreward:id/sb_show_completed"

- back
- assertVisible: "Profile"

# 杀进程后重新进入，确认最后配置仍在。
- stopApp
- runFlow: subflows/open-todo.yaml
- tapOn:
    id: "com.cozyla.choresreward:id/llDisplay"
- assertVisible:
    id: "com.cozyla.choresreward:id/rl_group_profile_container"
    selected: true
- assertVisible:
    id: "com.cozyla.choresreward:id/ll_sort_title_container"
    selected: true

# 恢复默认配置，避免污染后续 flow。
- tapOn:
    id: "com.cozyla.choresreward:id/rl_group_list_container"
- tapOn:
    id: "com.cozyla.choresreward:id/ll_sort_manual_container"
- assertVisible:
    id: "com.cozyla.choresreward:id/rl_group_list_container"
    selected: true
- assertVisible:
    id: "com.cozyla.choresreward:id/ll_sort_manual_container"
    selected: true
- back
- assertVisible: "List"
