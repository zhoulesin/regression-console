appId: com.cozyla.choresreward
name: Todo fixture list create edit persist delete
---
- runFlow: subflows/cleanup-fixture.yaml
- runFlow: subflows/create-fixture-list.yaml

- tapOn:
    id: "com.cozyla.choresreward:id/ll_todo_groupby_sort"
# more 图标绑定到夹具所在行，避免误操作其他 List（rightOf 只比坐标，不可用）。
- tapOn:
    id: "com.cozyla.choresreward:id/iv_todolist_sort_more"
    childOf:
      containsChild:
        id: "com.cozyla.choresreward:id/tv_todolist_title"
        text: "E2E Todo"
- tapOn:
    id: "com.cozyla.choresreward:id/ll_todolist_more_edit"

# 写入前确认打开的确实是夹具：名字不对就直接失败，不改任何数据。
- assertVisible:
    id: "com.cozyla.choresreward:id/et_todolist_name"
    text: "E2E Todo"

- tapOn:
    id: "com.cozyla.choresreward:id/et_todolist_name"
- eraseText
- inputText: "E2E Todo Edited"
- tapOn:
    id: "com.cozyla.choresreward:id/iv_todolist_create_color"
    index: 2
- tapOn:
    id: "com.cozyla.choresreward:id/iv_todolist_create_icon"
    index: 2
- tapOn:
    id: "com.cozyla.choresreward:id/tv_save"

- scrollUntilVisible:
    element: "E2E Todo Edited"
    direction: RIGHT
    timeout: 5000

- stopApp
- runFlow: subflows/open-todo.yaml
- runFlow: subflows/require-list-grouping.yaml
- scrollUntilVisible:
    element: "E2E Todo Edited"
    direction: RIGHT
    timeout: 5000
- assertVisible: "E2E Todo Edited"

- runFlow: subflows/cleanup-fixture.yaml
- assertNotVisible: "E2E Todo.*"
