appId: com.cozyla.choresreward
name: Todo creation sets flag and card shows flag icon
---
# 功能点 2.7：完整创建时设置优先级旗标，卡片展示旗标图标。
# 只验证一件事：创建对话框内设置的旗标在保存后体现在夹具卡片上。

- runFlow: subflows/cleanup-fixture.yaml
- runFlow: subflows/create-fixture-list.yaml

# --- 确保在 Todo 根页面 ---
# 等待 Todo 根页面加载完成
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/iv_todo_root_add"
    timeout: 5000

# --- 打开完整的创建对话框（使用根页的 Add 按钮）---
- tapOn:
    id: "com.cozyla.choresreward:id/iv_todo_root_add"

# --- 等待创建对话框打开 ---
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/editName"
    timeout: 3000

# --- 输入标题 ---
- tapOn:
    id: "com.cozyla.choresreward:id/editName"
- inputText: "E2EFlag"

# --- 确认选择的是夹具 List ---
- assertVisible:
    id: "com.cozyla.choresreward:id/txtTodoListDesc"
    text: "E2E Todo"

# --- 设置优先级旗标 ---
# 先点击空白区域关闭键盘
- tapOn:
    id: "com.cozyla.choresreward:id/txtTodoListDesc"

# 等待键盘关闭
- extendedWaitUntil:
    notVisible:
      id: "com.cozyla.choresreward:id/et_content"
    timeout: 3000

# 等待 imgFlag 可见
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/imgFlag"
    timeout: 3000

# 第一次点击 imgFlag，切换旗标状态
- tapOn:
    id: "com.cozyla.choresreward:id/imgFlag"

# 等待一下，让状态更新
- waitForAnimationToEnd:
    timeout: 1000

# 注意：代码中只设置了图片资源和背景样式，没有设置 selected 状态
# 所以无法通过 selected: true 来验证
# 直接继续创建，通过结果验证旗标是否生效

# --- 创建 Todo ---
- tapOn:
    id: "com.cozyla.choresreward:id/txtSave"

# --- 等待返回列表 ---
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/tv_todo_info_title"
    timeout: 5000

# --- 滚动查找 E2EFlag ---
- scrollUntilVisible:
    element: "E2EFlag"
    direction: DOWN
    timeout: 10000

# --- 结果：验证旗标图标可见 ---
# 验证标题为 E2EFlag 的 Todo 存在
- assertVisible:
    text: "E2EFlag"

# 验证 iv_todo_info_flag 可见（在包含 E2EFlag 的行中）
- assertVisible:
    id: "com.cozyla.choresreward:id/iv_todo_info_flag"
    childOf:
      containsDescendants:
        - text: "E2EFlag"
