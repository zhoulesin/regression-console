appId: com.cozyla.choresreward
name: Delete a single Todo
---
# 功能点 2.4：删除单条 Todo
# 判定依据：该条消失，夹具 List 仍在。
# 前提：有 1 个夹具 List；不点 Display / Filter。

- runFlow: subflows/cleanup-fixture.yaml
- runFlow: subflows/create-fixture-list.yaml

# --- 创建夹具 Todo ---
- tapOn:
    id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
    childOf:
      containsChild:
        id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
      childOf:
        containsDescendants:
          - id: "com.cozyla.choresreward:id/tv_todolist_title"
            text: "E2E Todo"
- tapOn:
    id: "com.cozyla.choresreward:id/et_content"
- inputText: "E2E_Delete"
- tapOn:
    id: "com.cozyla.choresreward:id/iv_confirm"
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/tv_todo_info_title"
      text: "E2E_Delete"
      childOf:
        containsDescendants:
          - id: "com.cozyla.choresreward:id/tv_todolist_title"
            text: "E2E Todo"
    timeout: 5000

# --- fail-closed：删前确认目标正确 ---
- assertVisible:
    id: "com.cozyla.choresreward:id/tv_todo_info_title"
    text: "E2E_Delete"
    childOf:
      containsDescendants:
        - id: "com.cozyla.choresreward:id/tv_todolist_title"
          text: "E2E Todo"

# --- 打开编辑弹窗 ---
- tapOn:
    id: "com.cozyla.choresreward:id/tv_todo_info_title"
    text: "E2E_Delete"
    childOf:
      containsDescendants:
        - id: "com.cozyla.choresreward:id/tv_todolist_title"
          text: "E2E Todo"

# --- 执行删除 ---
# 点击删除图标
- tapOn:
    id: "com.cozyla.choresreward:id/imgDeleteTodo"
# 首次会弹出 "Don't show this again" 提示，勾选后 App 持久化，后续不再弹。
# 用 when 而不是 optional：optional 找不到控件时仍会等满默认超时。
- runFlow:
    when:
      visible:
        id: "com.cozyla.choresreward:id/iv_hide_delete_tips"
    commands:
      - tapOn:
          id: "com.cozyla.choresreward:id/iv_hide_delete_tips"
# 确认删除——真实 resource-id 是 txtDelete（text: "Delete"），非臆造的「确认」
- tapOn:
    id: "com.cozyla.choresreward:id/txtDelete"

# --- 判定 1/2：该条消失 ---
- extendedWaitUntil:
    notVisible:
      id: "com.cozyla.choresreward:id/tv_todo_info_title"
      text: "E2E_Delete"
    timeout: 5000

# --- 判定 2/2：夹具 List 仍在（绑定到列表标题控件） ---
- assertVisible:
    id: "com.cozyla.choresreward:id/tv_todolist_title"
    text: "E2E Todo"
