appId: com.cozyla.choresreward
name: Todo check marks item complete
---
# 功能点 4.1：勾选完成。
# 验证：点击未完成 Todo 的勾选框 → 该条目从未完成区消失（移入已完成区）。

- runFlow: subflows/cleanup-fixture.yaml
- runFlow: subflows/create-fixture-list.yaml

# ── 快速添加一条未完成 Todo ──
- tapOn:
    id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
    childOf:
      containsChild:
        id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
      childOf:
        containsDescendants:
          - id: "com.cozyla.choresreward:id/tv_todolist_title"
            text: "E2E Todo"
- tapOn:
    id: "com.cozyla.choresreward:id/et_content"
- inputText: "E2ECheck"
- tapOn:
    id: "com.cozyla.choresreward:id/iv_confirm"

# 等待条目出现在未完成区
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/tv_todo_info_title"
      text: "E2ECheck"
      childOf:
        containsDescendants:
          - id: "com.cozyla.choresreward:id/tv_todolist_title"
            text: "E2E Todo"
    timeout: 5000

# ── 勾选完成 ──
# fl_todoitem_check 是勾选框的点击区域
- tapOn:
    id: "com.cozyla.choresreward:id/fl_todoitem_check"
    childOf:
      containsDescendants:
        - id: "com.cozyla.choresreward:id/tv_todo_info_title"
          text: "E2ECheck"

# 等待勾选动画结束
- waitForAnimationToEnd:
    timeout: 2000

# ── 判定：条目从未完成区消失 ──
# 勾选后，条目从未完成区移入已完成区。
# 未完成区使用 item_todo_root_child_item 布局，已完成区使用 item_todo_root_child_comp_item 布局。
# 两者的根 ID 不同：cons_todo_item_root vs cons_todo_comp_item_root。
# 断言 E2ECheck 在 cons_todo_item_root（未完成区）内不可见。
- assertNotVisible:
    id: "com.cozyla.choresreward:id/tv_todo_info_title"
    text: "E2ECheck"
    childOf:
      id: "com.cozyla.choresreward:id/cons_todo_item_root"
