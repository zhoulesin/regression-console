appId: com.cozyla.choresreward
name: Todo uncheck restores item to active list
---
# 功能点 4.3：反完成。
# 验证：点击已完成 Todo 的勾选框 → 该条目恢复为未完成态。

- runFlow: subflows/cleanup-fixture.yaml
- runFlow: subflows/create-fixture-list.yaml

# ── 创建一条 Todo 并勾选完成 ──
- tapOn:
    id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
    childOf:
      containsChild:
        id: "com.cozyla.choresreward:id/ll_fast_add_placeholder"
      childOf:
        containsDescendants:
          - id: "com.cozyla.choresreward:id/tv_todolist_title"
            text: "E2E Todo"
- tapOn:
    id: "com.cozyla.choresreward:id/et_content"
- inputText: "E2EUncomp"
- tapOn:
    id: "com.cozyla.choresreward:id/iv_confirm"

- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/tv_todo_info_title"
      text: "E2EUncomp"
    timeout: 5000

# 勾选完成
- tapOn:
    id: "com.cozyla.choresreward:id/fl_todoitem_check"
    childOf:
      containsDescendants:
        - id: "com.cozyla.choresreward:id/tv_todo_info_title"
          text: "E2EUncomp"

- waitForAnimationToEnd:
    timeout: 2000

# 确认已从未完成区消失
- assertNotVisible:
    id: "com.cozyla.choresreward:id/tv_todo_info_title"
    text: "E2EUncomp"
    childOf:
      id: "com.cozyla.choresreward:id/cons_todo_item_root"

# ── 展开已完成区 ──
# 已完成区可能折叠，点击展开图标
- tapOn:
    id: "com.cozyla.choresreward:id/iv_todoitem_expand"
    childOf:
      containsDescendants:
        - id: "com.cozyla.choresreward:id/tv_todolist_title"
          text: "E2E Todo"

- waitForAnimationToEnd:
    timeout: 1000

# ── 反完成：点击已完成区的勾选框 ──
# 已完成区使用 cons_todo_comp_item_root 布局
- tapOn:
    id: "com.cozyla.choresreward:id/fl_todoitem_check"
    childOf:
      containsDescendants:
        - id: "com.cozyla.choresreward:id/tv_todo_info_title"
          text: "E2EUncomp"
        - id: "com.cozyla.choresreward:id/cons_todo_comp_item_root"

- waitForAnimationToEnd:
    timeout: 2000

# ── 判定：条目恢复到未完成区 ──
# 反完成后，条目回到 cons_todo_item_root（未完成区）
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/tv_todo_info_title"
      text: "E2EUncomp"
      childOf:
        id: "com.cozyla.choresreward:id/cons_todo_item_root"
    timeout: 5000
