appId: com.cozyla.choresreward
---
# 进入 Todo 页。不要 stopApp：每条脚本若都杀进程，光启动就要十几秒。
# 杀进程是 2.5 / 0.x 自己的事，不放在公用子流程。
- setOrientation: PORTRAIT

- launchApp:
    clearState: false
    stopApp: false

# 先等底部导航渲染出来再点 Tab。
# 不用 optional：控件没出现时 optional 会空等默认约 12s，这里显式给 8s 上限。
- extendedWaitUntil:
    visible: "To-do"
    timeout: 8000
- tapOn: "To-do"

- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/rvTodo"
    timeout: 8000
