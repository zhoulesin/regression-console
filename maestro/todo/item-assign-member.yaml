appId: com.cozyla.choresreward
name: Todo assign member in full add
---
# 2.8 完整创建时指派成员，卡片展示成员头像
# 只验证一件事：完整创建 Todo 时指派成员后，夹具卡片上出现头像。

- runFlow: subflows/cleanup-fixture.yaml
- runFlow: subflows/create-fixture-list.yaml

# ── 打开根页完整创建弹窗 ──
- tapOn:
    id: "com.cozyla.choresreward:id/fab"

# Fail-closed：确认创建弹窗已打开
- assertVisible:
    id: "com.cozyla.choresreward:id/et_content"

# 输入标题
- tapOn:
    id: "com.cozyla.choresreward:id/et_content"
- inputText: "E2E_Assign"

# ── 指派成员 ──
# 点击 selectMember 按钮，打开 SelectMemberPopup
- tapOn:
    id: "com.cozyla.choresreward:id/tv_select_member"

# 断言 SelectMemberPopup 已弹出
- assertVisible:
    id: "com.cozyla.choresreward:id/rvPopupMember"

# 点击第一个成员头像（childOf 绑定到 Popup 内）
- tapOn:
    id: "com.cozyla.choresreward:id/imgMemberAvatar"
    index: 0
    childOf:
      id: "com.cozyla.choresreward:id/rvPopupMember"

# Fail-closed：断言成员已选中——llMember / txtMemberName / imgMemberAvatar 均在 Popup 内可见
- assertVisible:
    id: "com.cozyla.choresreward:id/llMember"
    childOf:
      id: "com.cozyla.choresreward:id/rvPopupMember"
- assertVisible:
    id: "com.cozyla.choresreward:id/txtMemberName"
    childOf:
      id: "com.cozyla.choresreward:id/rvPopupMember"
- assertVisible:
    id: "com.cozyla.choresreward:id/imgMemberAvatar"
    childOf:
      id: "com.cozyla.choresreward:id/rvPopupMember"

# 点击 txtSave 关闭 SelectMemberPopup，回到创建弹窗
- tapOn:
    id: "com.cozyla.choresreward:id/txtSave"

# 点击创建弹窗的 txtSave，创建 Todo 并回到根页
- tapOn:
    id: "com.cozyla.choresreward:id/txtSave"

# ── 判定：夹具卡片内该条 Todo 的头像可见 ──
# iv_todoitem_avatar 未指派时被 setGone 隐藏，可见即表示指派成功。
# childOf + containsDescendants 绑定到「E2E Todo」那张卡片，避免误命中其他 List。
- extendedWaitUntil:
    visible:
      id: "com.cozyla.choresreward:id/iv_todoitem_avatar"
      childOf:
        containsDescendants:
          - id: "com.cozyla.choresreward:id/tv_todolist_title"
            text: "E2E Todo"
    timeout: 5000
